name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v7 across the board: these run on node24. The older majors run on
      # node20, which GitHub has deprecated on its runners.
      - uses: actions/checkout@v7

      # No `version` here on purpose. This action reads the `packageManager`
      # field of package.json, so naming a version in both places is not
      # redundancy, it is two sources of truth: the action refuses to start
      # with "Multiple versions of pnpm specified" the moment they drift.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The generated client has to exist before tsc can see the types that
      # `@prisma/client` only has once it has been generated.
      - run: pnpm prisma generate

      - run: pnpm typecheck

      # No database and no network: the suite is pure logic plus a local
      # recorder standing in for the Stripe API.
      - run: pnpm test
